<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图片预览</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
      }

      img {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        opacity: 0;
      }

      img.ready {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <img alt="" id="preview-image" />
    <script type="module" src="/src/imagePreview.ts"></script>
  </body>
</html>
